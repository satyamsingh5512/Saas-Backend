      - generic [ref=e104]:
        - paragraph [ref=e105]: The part nobody budgets for
        - heading "You did not set out to build an invitation system." [level=2] [ref=e106]
        - paragraph [ref=e107]: Every B2B product arrives at the same six months of work before it can charge anyone. It is all undifferentiated, all load-bearing, and all of it fails quietly.
      - list [ref=e108]:
        - listitem [ref=e109]:
          - generic [ref=e110]: "01"
          - heading "One missing predicate is a breach" [level=3] [ref=e111]
          - paragraph [ref=e112]:
            - text: Isolation lives in whichever
            - code [ref=e113]: WHERE
            - text: clause the last developer remembered. The query that forgets is indistinguishable from the query that works — until it is in a customer's export.
        - listitem [ref=e114]:
          - generic [ref=e115]: "02"
          - heading "Roles calcify into if-statements" [level=3] [ref=e116]
          - paragraph [ref=e117]: Permissions start as three constants in middleware. By the time a customer asks for a read-only auditor, changing who can do what means a deploy.
        - listitem [ref=e118]:
          - generic [ref=e119]: "03"
          - heading "Machine access is an afterthought" [level=3] [ref=e120]
          - paragraph [ref=e121]: API keys get bolted on with the permissions of whoever made them, so a key silently gains power when its owner is promoted and keeps it after they leave.
        - listitem [ref=e122]:
          - generic [ref=e123]: "04"
          - heading "The audit log arrives too late" [level=3] [ref=e124]
          - paragraph [ref=e125]:
            - text: It gets written the week the first security questionnaire lands, on a table the application can still
            - code [ref=e126]: UPDATE
            - text: — which is the one property an auditor asks about.
