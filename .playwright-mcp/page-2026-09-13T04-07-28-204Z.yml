    - generic [ref=e257]:
      - generic [ref=e258]:
        - paragraph [ref=e259]: What is already finished
        - heading "Complete on the first day, not scaffolded" [level=2] [ref=e260]
        - paragraph [ref=e261]: Each capability is wired end to end — SQL schema, service rules, HTTP surface, and a screen in the workspace.
      - list [ref=e262]:
        - listitem [ref=e263]:
          - heading "Authentication that survives a stolen token" [level=3] [ref=e264]
          - paragraph [ref=e265]: Password login, refresh-token rotation with reuse detection, password reset, email verification, and GitHub OAuth. Changing a password revokes every refresh token for that user.
          - list [ref=e266]:
            - listitem [ref=e267]: Rotating refresh families
            - listitem [ref=e268]: bcrypt at rest
            - listitem [ref=e269]: OAuth state signed with HMAC
        - listitem [ref=e270]:
          - heading "Roles you can edit at runtime" [level=3] [ref=e271]
          - paragraph [ref=e272]: Five roles and 21 permissions seeded per tenant. Checks resolve from the database on every request, so a change applies without a deploy.
        - listitem [ref=e273]:
          - heading "Keys that authorize themselves" [level=3] [ref=e274]
          - paragraph [ref=e275]: Scoped machine credentials, hashed at rest, revocable. A key authorizes from its own scopes, never from its creator's current role — and cannot be granted role or org management at all.
        - listitem [ref=e276]:
          - heading "Teams, members, invitations" [level=3] [ref=e277]
          - paragraph [ref=e278]: Single-use hashed invite tokens, redeemable without a prior account, accepted in one atomic database function.
        - listitem [ref=e279]:
          - heading "Quotas enforced at the point of use" [level=3] [ref=e280]
          - paragraph [ref=e281]: Seat and project limits are checked before the write is allowed, not reported on a dashboard afterwards.
        - listitem [ref=e282]:
          - heading "An audit trail a compromised credential cannot edit" [level=3] [ref=e283]
          - paragraph [ref=e284]:
            - code [ref=e285]: audit_logs
            - text: "is append-only in the strongest available sense: the application role holds no"
            - code [ref=e286]: UPDATE
            - text: or
            - code [ref=e287]: DELETE
            - text: grant on it, so erasing the trail is not a permission the running process has to lose — it never had it.
          - list [ref=e288]:
            - listitem [ref=e289]: Separate product-facing timeline
            - listitem [ref=e290]: Secrets never written to entries
            - listitem [ref=e291]: Actor, IP and user agent captured
