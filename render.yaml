# Render Blueprint — deployable preview environment.
#
# The free plans keep initial Blueprint provisioning from requiring a paid
# billing setup. They are suitable for evaluation only: the web service sleeps
# when idle, and a free Render Postgres database expires after 30 days. Upgrade
# both plan fields before storing production data.
#
# Neither secret is committed. JWT_SECRET is generated by Render; DATABASE_URL is
# injected from the managed database's private connection string.
services:
  - type: web
    name: tenant-saas-backend
    runtime: docker
    plan: free
    region: singapore
    # Render restarts an instance that fails this probe. Startup does not begin
    # listening until the database is connected and migrations have completed.
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production

      # Render routes to the port the process listens on; 10000 is its default.
      - key: PORT
        value: "10000"

      - key: JWT_SECRET
        generateValue: true

      # Outbound email via Resend. sync: false keeps the key out of the
      # Blueprint: enter it in the dashboard once, and Render preserves it across
      # deploys. Leaving it unset is a supported state -- the no-op transport logs
      # each undeliverable message and every flow still mints and stores its
      # token, so invitations remain usable from the dashboard link.
      - key: RESEND_API_KEY
        sync: false
      # Must be on a domain verified in Resend, or every send is rejected.
      - key: MAIL_FROM
        sync: false
      # Public origin used to build invite, reset and verification links. Set this
      # to whichever origin a recipient should land on: the Vercel domain when the
      # frontend is deployed there, otherwise this service's own URL. A link built
      # without it goes nowhere.
      - key: APP_BASE_URL
        sync: false

      # Render disks are not part of this preview blueprint, so production file
      # uploads use an S3-compatible bucket. Set these in the Render dashboard.
      - key: STORAGE_DRIVER
        value: s3
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_USE_PATH_STYLE
        value: "false"
      - key: S3_SECURE
        value: "true"

      - key: DATABASE_URL
        fromDatabase:
          name: tenant-saas-postgres
          property: connectionString

      # The runtime credential above must be a NOSUPERUSER NOBYPASSRLS role, or
      # row-level security is inert and every tenant sees every other tenant's
      # rows. Managed providers do not give you one by default: Render's database
      # user owns the tables (handled by FORCE ROW LEVEL SECURITY) and Aiven's
      # avnadmin holds rolbypassrls, which FORCE does not override.
      #
      # MIGRATE_DATABASE_URL is the privileged credential, used only to apply
      # migrations at startup and then closed before the server begins serving.
      # It is required whenever DATABASE_URL points at the low-privilege role,
      # because CREATE TABLE and CREATE POLICY are exactly the grants that role
      # must not have. Leave it unset only when both are the same credential.
      #
      #   1. psql "$MIGRATE_DATABASE_URL" \
      #        -v app_user_password="$(openssl rand -hex 24)" \
      #        -f scripts/provision_app_role.sql
      #   2. Set DATABASE_URL to that app_user connection string.
      #   3. Set MIGRATE_DATABASE_URL to the privileged one.
      #
      # Verify with: SELECT current_user, rolsuper, rolbypassrls
      #              FROM pg_roles WHERE rolname = current_user;
      # - key: MIGRATE_DATABASE_URL
      #   sync: false

      # Token lifetimes. A 15-minute access token bounds the damage from a leaked
      # bearer token; the refresh token rotates on every use with theft detection.
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 720h
      - key: PASSWORD_RESET_TTL
        value: 1h
      - key: EMAIL_VERIFICATION_TTL
        value: 24h
      - key: INVITATION_TTL
        value: 168h

      # Redis caching (free tier works: Render Key Value, Upstash, etc.).
      # Create the instance once, then paste its values here; Render preserves
      # sync:false entries across deploys. Format is host:port (no scheme).
      # Empty REDIS_ADDR disables caching gracefully -- every check queries
      # Postgres instead, which is correct but slower. A sleeping or
      # unreachable Redis is equally safe: reads fail open to a miss, so the
      # only symptom is uncached latency until it answers again.
      - key: REDIS_ADDR
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_DB
        value: "0"

      # Keep-alive against free-tier idle sleep. Every KEEPALIVE_INTERVAL the
      # server pings the database pool and GETs APP_BASE_URL/health, which
      # arrives as inbound traffic and resets the host's idle timer. Requires
      # APP_BASE_URL set to this service's public URL; without it only the
      # database half runs. Cannot prevent trial-expiry deletion or the free
      # Postgres 30-day expiry -- only idle sleep.
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL
        value: 1m

      # Connection pool. Kept well under the instance's connection ceiling:
      # exceeding max_connections turns a traffic spike into a hard outage,
      # whereas a bounded pool queues. Raise together with the database plan,
      # not independently of it.
      - key: DB_MAX_OPEN_CONNS
        value: "20"
      - key: DB_MAX_IDLE_CONNS
        value: "5"
      # Recycling connections lets a managed-Postgres failover or rolling restart
      # be picked up without an application restart.
      - key: DB_CONN_MAX_LIFETIME
        value: 30m
      - key: DB_CONN_MAX_IDLE_TIME
        value: 5m

      # Must stay below Render's termination grace period so in-flight requests
      # drain on deploy rather than being severed mid-response.
      - key: SHUTDOWN_TIMEOUT
        value: 20s

      # Subdomain tenant routing is off. Render serves this service from
      # <name>.onrender.com, where the leftmost label is the service name and not
      # a tenant slug -- inferring a tenant from it makes every pre-auth lookup
      # fail. Set this only once tenants live on subdomains of a domain you own,
      # and set it to that apex (e.g. ourapp.com), never to onrender.com.
      # - key: TENANT_BASE_DOMAIN
      #   value: ourapp.com

      # CORS stays disabled, including with the frontend on Vercel. vercel.json
      # rewrites /api and /health to this service, so the browser only ever makes
      # same-origin requests and no cross-origin grant is required. Set this only
      # if you drop the proxy and call this API directly from another origin;
      # note that an exact-match list will not cover Vercel's per-deploy preview
      # hostnames. There is no wildcard mode by design — responses carry
      # credentials.
      # - key: CORS_ALLOWED_ORIGINS
      #   value: https://your-app.vercel.app

databases:
  - name: tenant-saas-postgres
    plan: free
    region: singapore
    # Keep deployment behavior aligned with the PostgreSQL version documented and
    # tested by this repository instead of silently following Render's latest.
    postgresMajorVersion: "16"
    databaseName: tenant_saas
    user: tenant_saas
    # Restrict inbound access to Render's private network. With no ipAllowList
    # entries the database is not reachable from the public internet, and the web
    # service connects over the internal connection string.
    ipAllowList: []
