# Render blueprint — production.
#
# Deliberately NOT on the free tier: a free Render Postgres expires 30 days
# after creation and is then deleted, and a free web service sleeps after 15
# minutes idle. Both are disqualifying for anything real, so the plans below are
# the paid tiers that persist.
#
# Neither secret is committed. JWT_SECRET is generated by Render; DATABASE_URL is
# injected from the managed database's private connection string.
services:
  - type: web
    name: tenant-saas-backend
    runtime: docker
    plan: starter
    region: singapore
    # Render restarts an instance that fails this probe. The endpoint checks the
    # database connection, so a deploy with an unreachable database fails loudly
    # instead of serving 500s.
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production

      # Render routes to the port the process listens on; 10000 is its default.
      - key: PORT
        value: "10000"

      - key: JWT_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: tenant-saas-postgres
          property: connectionString

      # Token lifetimes. A 15-minute access token bounds the damage from a leaked
      # bearer token; the refresh token rotates on every use with theft detection.
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 720h
      - key: PASSWORD_RESET_TTL
        value: 1h
      - key: EMAIL_VERIFICATION_TTL
        value: 24h
      - key: INVITATION_TTL
        value: 168h

      # Connection pool. Kept well under the instance's connection ceiling:
      # exceeding max_connections turns a traffic spike into a hard outage,
      # whereas a bounded pool queues. Raise together with the database plan,
      # not independently of it.
      - key: DB_MAX_OPEN_CONNS
        value: "20"
      - key: DB_MAX_IDLE_CONNS
        value: "5"
      # Recycling connections lets a managed-Postgres failover or rolling restart
      # be picked up without an application restart.
      - key: DB_CONN_MAX_LIFETIME
        value: 30m
      - key: DB_CONN_MAX_IDLE_TIME
        value: 5m

      # Must stay below Render's termination grace period so in-flight requests
      # drain on deploy rather than being severed mid-response.
      - key: SHUTDOWN_TIMEOUT
        value: 20s

      # CORS stays disabled: the dashboard is served from the same origin as the
      # API, so no cross-origin grant is needed. Set this only if you later host a
      # separate frontend. There is no wildcard mode by design — responses carry
      # credentials.
      # - key: CORS_ALLOWED_ORIGINS
      #   value: https://app.example.com

databases:
  - name: tenant-saas-postgres
    plan: basic-256mb
    region: singapore
    databaseName: tenant_saas
    user: tenant_saas
    # Restrict inbound access to Render's private network. With no ipAllowList
    # entries the database is not reachable from the public internet, and the web
    # service connects over the internal connection string.
    ipAllowList: []
