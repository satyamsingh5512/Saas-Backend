# Bootstrap config: serves ONLY the ACME http-01 challenge over plain HTTP.
# Used once (and on cert issuance failures) before any certificate exists,
# because the full nginx.conf cannot start without certificate files.
# The deploy script swaps this for the rendered full config after issuance.
# Never serves application traffic.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    server_tokens off;
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 503 "TLS bootstrap in progress";
        }
    }
}
