# Production reverse proxy for the Tenant SaaS backend on a single Oracle VM.
#
# Placeholders __DOMAIN__ and __APP_HOST__ are substituted by
# scripts/deploy_oracle.sh from the DOMAIN env var (app service name inside
# the compose network). TLS certificates are mounted read-only from the
# certbot-managed host path by docker-compose.production.yml.
#
# Request path:  client -> :80 (redirect) / :443 (nginx) -> app:8080 (Go/Gin)
# Static dashboard assets (/assets) are served by the Go binary's embedded
# filesystem; nginx caches them at the edge per the caching block below.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 2-OCPU VM: 1024 connections x 1 worker is far above the Go pool
    # (DB_MAX_OPEN_CONNS=20); nginx must never be the bottleneck, and with
    # keepalive + small payloads it will not be.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # NOTE: $uri (not $request/$request_uri) is logged deliberately: the SSE
    # stream accepts ?access_token= for EventSource clients, and query strings
    # in access logs would persist bearer tokens to disk. Header auth remains
    # the default; this makes the query fallback log-safe.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time upstr=$upstream_response_time rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    # --- Performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;

    # --- Request hardening ---
    # Must cover the largest legitimate upload (MAX_UPLOAD_BYTES=25MB default)
    # plus multipart overhead. Larger bodies are rejected with 413 before
    # touching the Go process, which is the cheapest place to say no.
    client_max_body_size 30m;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # --- Gzip: API JSON + dashboard text assets. Images/fonts/uploads are
    # already compressed or incompressible -- excluded by type. ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        text/css
        text/html
        text/plain
        text/xml
        image/svg+xml;

    # --- Rate limiting ---
    # Zones are per-client-IP and live in shared memory (10m ~= 160k IPs).
    # Auth/invite endpoints get their own strict zone because they guard
    # credentials and invite tokens; the general API zone is generous because
    # legitimate dashboard polling + SSE reconnections must not 429.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_status 429;

    # Shared TLS + proxy defaults for every HTTPS server block.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upstream: the Go app. keepalive reuses backend connections instead of
    # re-dialing per request (matters once request volume grows).
    upstream app {
        server __APP_HOST__:8080;
        keepalive 32;
    }

    # --- HTTP: redirect everything to HTTPS. No application traffic served. ---
    server {
        listen 80;
        listen [::]:80;
        server_name __DOMAIN__;

        # Certbot's http-01 challenge path must stay reachable over HTTP.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: the only application entrypoint. ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name __DOMAIN__;

        ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

        # HSTS: one year, subdomains included. Only ever served over TLS, so
        # no risk of pinning a plaintext host (the Go app applies the same
        # logic per-request for defense in depth).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # --- Live notification stream: never buffer, never time out early ---
        location = /api/v1/notifications/stream {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding on;
        }

        # --- Static dashboard assets: cached at the edge for a year ---
        # Filenames are content-addressed by the embedded build (and small in
        # count), so a long max-age is safe; HTML documents below are never
        # cached, which is what picks up new asset filenames on deploy.
        location /assets/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_valid 200 365d;
            expires 365d;
            add_header Cache-Control "public, immutable" always;
        }

        # --- Auth + public invite endpoints: strict rate limit ---
        location ~ ^/api/v1/(auth|invitations/(preview|accept)) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # --- Everything else (API, dashboard HTML, swagger, metrics*) ---
        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # * /metrics: additionally consider an nginx allow-list
        # (allow 127.0.0.1; allow <prometheus-ip>; deny all;) or METRICS_TOKEN
        # when the endpoint must face the public internet. Both are documented
        # in docs/DEPLOY_ORACLE.md; the default below proxies it like any API
        # route so in-network Prometheus works with zero extra config.
    }
}
